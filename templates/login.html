{% extends "base.html" %}
{% block title %}Login — TaskFlow{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">

        <!-- Brand -->
        <div class="auth-brand">
            <span class="brand-icon">✦</span>
            <h1>TaskFlow</h1>
        </div>
        <p class="auth-subtitle">Sign in to your workspace</p>

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Sign In
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>

    </div>
</div>
{% endblock %}
