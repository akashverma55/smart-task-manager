{% extends "base.html" %}
{% block title %}Register — TaskFlow{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">

        <!-- Brand -->
        <div class="auth-brand">
            <span class="brand-icon">✦</span>
            <h1>TaskFlow</h1>
        </div>
        <p class="auth-subtitle">Create your account</p>

        <!-- Register Form -->
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="johndoe"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Min 6 characters"
                    required
                    minlength="6"
                >
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Create Account
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Sign in here</a>
        </p>

    </div>
</div>
{% endblock %}
